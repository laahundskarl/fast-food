services:
  db:
    image: mysql:8
    container_name: fastfood_db
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASS}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASS}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  api-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - ./wait-for.sh:/wait-for.sh
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    command: sh -c "/wait-for.sh $DATABASE_HOST:$DATABASE_PORT -- npx prisma migrate deploy && npm ci && npx prisma generate && npm run dev"
    depends_on:
      - db

volumes:
  db_data:
